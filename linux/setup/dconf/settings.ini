[org/gnome/shell/extensions/dash-to-dock]
dock-position='LEFT'
extend-height=false
dock-fixed=true
custom-theme-shrink=false
show-apps-at-top=false
dash-max-icon-size=44
show-mounts=false
running-indicator-style='DOTS'
custom-theme-customize-running-dots=true
custom-theme-running-dots-color='#b98cff'
custom-theme-running-dots-border-color='#ffffff'
custom-theme-running-dots-border-width=0

[org/gnome/desktop/interface]
gtk-theme='Yaru-purple-dark'
icon-theme='Yaru-purple-dark'
cursor-theme='Bibata-Modern-Classic'
color-scheme='prefer-dark'
clock-show-weekday=true

[org/gnome/desktop/wm/keybindings]
switch-input-source=['XF86Keyboard']
switch-input-source-backward=['<Shift>XF86Keyboard']

[org/gnome/desktop/background]
picture-options='zoom'
