# zecross-rice : le casque Bluetooth reste en mode musique (A2DP).
# - pas de bascule en mode appel quand une appli ouvre le micro (Discord…) ;
# - mode appel (HFP/HSP) désactivé : le casque n'ouvre que le canal musique à la
#   connexion (évite les échecs de connexion). Le micro utilisé est celui du PC.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}
